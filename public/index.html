<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EE Graph Studio</title>
  <style>
    @font-face {
      font-family: 'Fields';
      src: url('/fonts/Fields-Regular.otf') format('opentype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Fields';
      src: url('/fonts/Fields-SemiBold.otf') format('opentype');
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'Fields';
      src: url('/fonts/Fields-Bold.otf') format('opentype');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/fonts/Inter-VariableFont_slnt,wght.ttf') format('truetype-variations');
      font-weight: 100 900;
      font-display: swap;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- MAIN LAYOUT -->
  <div class="layout">

    <!-- CANVAS -->
    <div class="canvas-area">
      <div class="canvas-viewport" id="viewport">
        <div class="canvas-world" id="world"></div>
      </div>
      <!-- Empty state -->
      <div class="canvas-empty" id="canvasEmpty">
        <div class="canvas-empty-headline">What-if scenario planning</div>
        <div class="canvas-empty-desc">Ask a question and watch the AI analyze your org data in real time.</div>
        <div class="canvas-starter-area" id="canvasStarterCards"></div>
      </div>
      <button class="canvas-restart-btn" id="canvasRestartBtn"><i class="ph ph-arrow-counter-clockwise"></i> Try a different scenario</button>

      <!-- Canvas controls: zoom + theme -->
      <div class="canvas-controls" id="canvasControls">
        <button class="canvas-ctrl-btn" id="zoomIn" title="Zoom in"><i class="ph ph-plus"></i></button>
        <button class="canvas-ctrl-btn" id="zoomOut" title="Zoom out"><i class="ph ph-minus"></i></button>
        <button class="canvas-ctrl-btn" id="zoomFit" title="Fit to screen"><i class="ph ph-arrows-out"></i></button>
        <div class="canvas-ctrl-sep"></div>
        <button class="canvas-ctrl-btn" id="themeToggle" title="Toggle light/dark"><i class="ph ph-sun"></i></button>
      </div>
    </div>

    <!-- DECISION LOG -->
    <div class="decision-log collapsed" id="decisionLog" style="display:none">
      <div class="dl-header">
        <button class="dl-header-toggle" id="dlToggle" title="Toggle Decision Log">&#9656;</button>
        <span class="dl-header-title">Decision Log</span>
        <span class="dl-header-count" id="dlCount" style="display:none">0</span>
      </div>

      <div class="dl-content" id="dlContent">
        <div class="dl-empty" id="dlEmpty">Decisions will appear here as you explore scenarios</div>
      </div>

      <div class="dl-footer">
        <button class="fab-btn fab-btn-primary fab-btn-block dl-execute" id="dlExecute" disabled>
          Execute Decisions<span class="dl-execute-count" id="dlExecuteCount"></span>
        </button>
      </div>
    </div>

  </div>

  <!-- CONVERSATION (floating over canvas) -->
  <div class="conversation" id="conversation">
    <div class="convo-header">
      <i class="ph-fill ph-sparkle convo-header-icon"></i>
      <span class="convo-header-title">BambooHR Assistant</span>
      <button class="convo-header-close" id="convoClose" title="Collapse to center"><i class="ph ph-caret-down"></i></button>
    </div>

    <div class="convo-messages" id="messages">
      <!-- Populated by JS on boot -->
    </div>

    <!-- Peek: last AI response (centered mode collapsed state) -->
    <div class="convo-peek" id="convoPeek">
      <div class="convo-peek-text" id="convoPeekText"></div>
      <button class="convo-peek-sidebar" id="convoPeekSidebar" title="Open in sidebar"><i class="ph ph-sidebar-simple"></i></button>
      <div class="convo-peek-btn" id="convoPeekBtn"><i class="ph ph-caret-up" id="convoPeekIcon"></i></div>
    </div>

    <div class="convo-input-area">
      <div class="convo-input-border">
        <div class="convo-input-inner">
          <textarea class="convo-input" id="chatInput" placeholder="Ask about anything" rows="1"></textarea>
          <button class="convo-send" id="chatSend"><i class="ph-fill ph-arrow-circle-up"></i></button>
        </div>
      </div>
    </div>

    <!-- Voice orb (kiosk mode) -->
    <div class="voice-area" id="voiceArea" style="display:none;">
      <div class="voice-transcript-bubble" id="voiceTranscript" style="display:none;"></div>
      <div class="voice-debug" id="voiceDebug" style="display:none;font-size:11px;color:#999;max-height:60px;overflow-y:auto;width:100%;text-align:center;"></div>
      <div class="voice-orb-row">
        <button class="voice-orb voice-idle" id="voiceOrb">
          <div class="voice-orb-inner">
            <svg class="voice-icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="1" width="6" height="12" rx="3"/>
              <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
              <line x1="12" y1="18" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </div>
          <div class="voice-wave-bars" style="display:none;">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <svg class="voice-spinner" style="display:none;" viewBox="0 0 26 26" fill="none">
            <circle cx="13" cy="13" r="10" stroke="currentColor" stroke-width="2.5" stroke-dasharray="20 43" stroke-linecap="round">
              <animateTransform attributeName="transform" type="rotate" from="0 13 13" to="360 13 13" dur="1s" repeatCount="indefinite"/>
            </circle>
          </svg>
        </button>
        <span class="voice-hint" id="voiceHint">Tap to ask a question</span>
      </div>
    </div>
  </div>

  <script src="system-prompt.js"></script>
  <script src="ai-client.js"></script>
  <script src="canvas-engine.js"></script>
  <script src="app.js"></script>
  <script src="voice.js"></script>
  <script src="modes/scenario.js"></script>
  <script>
    Studio.boot();

    // Theme toggle (icon-based)
    const themeBtn = document.getElementById('themeToggle');
    const saved = localStorage.getItem('ee-theme');
    function updateThemeIcon() {
      const isLight = document.documentElement.classList.contains('light');
      themeBtn.innerHTML = isLight ? '<i class="ph ph-moon"></i>' : '<i class="ph ph-sun"></i>';
    }
    if (saved !== 'dark') {
      document.documentElement.classList.add('light');
    }
    updateThemeIcon();
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('light');
      updateThemeIcon();
      const isLight = document.documentElement.classList.contains('light');
      localStorage.setItem('ee-theme', isLight ? 'light' : 'dark');
      document.dispatchEvent(new CustomEvent('themechange', { detail: { light: isLight } }));
    });

    // Zoom controls
    document.getElementById('zoomIn').addEventListener('click', () => CanvasEngine.zoomStep(1));
    document.getElementById('zoomOut').addEventListener('click', () => CanvasEngine.zoomStep(-1));

    // Default to centered chat mode
    document.documentElement.classList.add('chat-centered');

    function setChatMode(centered) {
      document.documentElement.classList.toggle('chat-centered', centered);
      document.dispatchEvent(new CustomEvent('chatlayoutchange', { detail: { centered } }));
    }

    // "Open in sidebar" button (centered → sidebar)
    document.getElementById('convoPeekSidebar').addEventListener('click', (e) => {
      e.stopPropagation(); // don't trigger peek expand
      setChatMode(false);
    });

    // "Close panel" button (sidebar → centered)
    document.getElementById('convoClose').addEventListener('click', () => {
      setChatMode(true);
    });

    // ── Voice orb (kiosk mode) ──
    (function() {
      const voiceArea = document.getElementById('voiceArea');
      const inputArea = document.querySelector('.convo-input-area');
      const orb = document.getElementById('voiceOrb');
      const hint = document.getElementById('voiceHint');
      const transcriptEl = document.getElementById('voiceTranscript');
      const orbInner = orb.querySelector('.voice-orb-inner');
      const waveBars = orb.querySelector('.voice-wave-bars');
      const spinner = orb.querySelector('.voice-spinner');
      const msgs = document.getElementById('messages');
      const debugEl = document.getElementById('voiceDebug');

      let voice = null;
      let currentUserMsg = null;
      let currentAiMsg = null;

      function vlog(msg) {
        const line = document.createElement('div');
        line.textContent = `${new Date().toLocaleTimeString().slice(0,8)} ${msg}`;
        debugEl.appendChild(line);
        debugEl.scrollTop = debugEl.scrollHeight;
      }

      function enableVoiceMode() {
        inputArea.style.display = 'none';
        voiceArea.style.display = 'flex';
        debugEl.style.display = 'block';
      }

      function addUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'msg msg-user';
        div.textContent = text;
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
        return div;
      }

      function addAiMessage(text) {
        const wrapper = document.createElement('div');
        wrapper.className = 'msg msg-ai';
        const content = document.createElement('div');
        content.className = 'msg-ai-content';
        content.textContent = text;
        wrapper.appendChild(content);
        msgs.appendChild(wrapper);
        msgs.scrollTop = msgs.scrollHeight;
        return content;
      }

      function setOrbState(state) {
        orb.className = 'voice-orb';
        orbInner.style.display = 'none';
        waveBars.style.display = 'none';
        spinner.style.display = 'none';
        transcriptEl.style.display = 'none';

        switch (state) {
          case 'idle':
            orb.classList.add('voice-idle');
            orbInner.style.display = 'flex';
            hint.textContent = 'Tap to ask a question';
            hint.style.color = '';
            break;
          case 'connecting':
            orb.classList.add('voice-processing');
            spinner.style.display = 'block';
            hint.textContent = 'Connecting...';
            hint.style.color = '';
            break;
          case 'listening':
            orb.classList.add('voice-listening');
            orbInner.style.display = 'flex';
            hint.textContent = 'Listening...';
            hint.style.color = '';
            break;
          case 'processing':
            orb.classList.add('voice-processing');
            spinner.style.display = 'block';
            hint.textContent = 'Thinking...';
            hint.style.color = '';
            break;
          case 'speaking':
            orb.classList.add('voice-speaking');
            waveBars.style.display = 'flex';
            hint.textContent = 'Tap to stop';
            hint.style.color = '#8a8582';
            break;
        }
      }

      function initVoice() {
        voice = new VoiceManager({
          canvasEnabled: true,
          onStateChange(state) {
            setOrbState(state);
            if (state === 'listening') {
              currentUserMsg = null;
              currentAiMsg = null;
            }
          },
          onInputTranscript(text, finished) {
            if (!currentUserMsg) {
              currentUserMsg = addUserMessage(text);
            } else {
              currentUserMsg.textContent = text;
              msgs.scrollTop = msgs.scrollHeight;
            }
            transcriptEl.textContent = text;
            transcriptEl.style.display = 'block';
            if (finished) {
              transcriptEl.style.display = 'none';
              currentUserMsg = null;
            }
          },
          onOutputTranscript(text, finished) {
            if (!currentAiMsg) {
              currentAiMsg = addAiMessage(text);
            } else {
              currentAiMsg.textContent = text;
              msgs.scrollTop = msgs.scrollHeight;
            }
            if (finished) {
              currentAiMsg = null;
            }
          },
          onToolCall(name, args) {
            vlog(`→ ${name}(${JSON.stringify(args).slice(0,40)})`);
          },
          onCanvasCard(toolName, args) {
            if (toolName === 'show_cards') vlog(`★ show_cards: ${(args.cards||[]).length} cards`);
            else if (toolName === 'show_card') vlog(`★ show_card: ${args.title}`);
            else if (toolName === 'set_root') vlog(`★ set_root: ${args.entity?.name || args.topic?.title}`);
            else if (toolName === 'show_comparison') vlog(`★ show_comparison: ${(args.options||[]).length} options`);
            else vlog(`★ ${toolName}`);
          },
          onError(msg) {
            console.error('Voice error:', msg);
            hint.textContent = 'Voice unavailable';
          }
        });
      }

      orb.addEventListener('click', () => {
        if (!voice) initVoice();

        if (voice.state === 'idle') {
          voice.start();
        } else if (voice.state === 'speaking') {
          voice.interrupt();
        } else if (voice.state === 'listening' || voice.state === 'processing') {
          voice.stop();
        }
      });

      // Enable voice mode via URL param: ?voice=1
      if (new URLSearchParams(window.location.search).has('voice')) {
        enableVoiceMode();
      }

      // Expose for console testing
      window._enableVoice = enableVoiceMode;
    })();

    // ── Centered chat: peek / expand behavior ──
    (function() {
      const convo = document.getElementById('conversation');
      const msgs = document.getElementById('messages');
      const peek = document.getElementById('convoPeek');
      const peekText = document.getElementById('convoPeekText');
      const peekIcon = document.getElementById('convoPeekIcon');
      let didAutoExpand = false;

      function setExpanded(expanded) {
        // Block collapse when in domain selection mode
        if (!expanded && convo.classList.contains('convo-selecting')) return;
        convo.classList.toggle('convo-expanded', expanded);
        peekIcon.className = expanded ? 'ph ph-caret-down' : 'ph ph-caret-up';
        if (expanded) requestAnimationFrame(() => msgs.scrollTop = msgs.scrollHeight);
      }

      // Watch messages for changes → update peek text + started state
      new MutationObserver(() => {
        const hasMessages = msgs.querySelectorAll('.msg').length > 0;

        if (hasMessages) {
          const wasStarted = convo.classList.contains('convo-started');
          convo.classList.add('convo-started');
          document.getElementById('chatInput').placeholder = 'Reply...';
          const rb = document.getElementById('restartBtn');
          if (rb) rb.style.display = '';
          const crb = document.getElementById('canvasRestartBtn');
          if (crb) crb.style.display = '';

          // Domain selection mode: proposals visible → lock open, special layout
          const hasProposals = msgs.querySelector('.scenario-proposals');
          const wasSelecting = convo.classList.contains('convo-selecting');
          convo.classList.toggle('convo-selecting', !!hasProposals);
          if (hasProposals && !convo.classList.contains('convo-expanded')) {
            setExpanded(true);
          }
          // Collapse when selection ends (proposals confirmed/removed)
          if (wasSelecting && !hasProposals) {
            setExpanded(false);
          }

          // Scroll to bottom if already expanded
          if (convo.classList.contains('convo-expanded')) {
            requestAnimationFrame(() => msgs.scrollTop = msgs.scrollHeight);
          }
        } else {
          convo.classList.remove('convo-started', 'convo-expanded', 'convo-selecting');
          peekText.textContent = '';
          peekIcon.className = 'ph ph-caret-up';
          document.getElementById('chatInput').placeholder = 'Ask about anything';
          didAutoExpand = false;
          return;
        }

        // Peek text: active status wins over stale AI responses
        const statusEl = msgs.querySelector('.msg-status-text');
        const aiMsgs = msgs.querySelectorAll('.msg-ai-content');
        if (statusEl) {
          peekText.textContent = statusEl.textContent;
          peek.classList.add('convo-peek-thinking');
        } else if (aiMsgs.length > 0) {
          peekText.textContent = aiMsgs[aiMsgs.length - 1].textContent.trim().slice(0, 300);
          peek.classList.remove('convo-peek-thinking');
        } else {
          peek.classList.remove('convo-peek-thinking');
        }
      }).observe(msgs, { childList: true, subtree: true, characterData: true });

      // Click peek → toggle expand
      peek.addEventListener('click', () => {
        setExpanded(!convo.classList.contains('convo-expanded'));
      });

      // Escape → collapse
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && convo.classList.contains('convo-expanded')) {
          setExpanded(false);
        }
      });
    })();
  </script>
</body>
</html>
